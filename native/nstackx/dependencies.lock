# MalekPlayer NSTACKX dependency lock
# All refs are immutable Git commit IDs; do not replace with master/main tags.
# Upstream NSTACKX source is pinned to the user's selected OpenHarmony revision.
# This file pins source acquisition only; Android compatibility/build is validated in later phases.

NSTACKX_REPOSITORY=https://github.com/openharmony/communication_t2stack.git
NSTACKX_COMMIT=fbf280db18092eb00bb065e59ce6676c7b85b8c9

# DFinder CoAP dependency (OpenHarmony maintained libcoap snapshot).
LIBCOAP_REPOSITORY=https://github.com/openharmony/third_party_libcoap.git
LIBCOAP_COMMIT=90d3c3f9ceac2b25aea132bfce080af851315097
LIBCOAP_LICENSE=BSD-2-Clause

# JSON payload dependency.
CJSON_REPOSITORY=https://github.com/openharmony/third_party_cJSON.git
CJSON_COMMIT=28dba43de56de279d1b5b74565f4277c89c50f35
CJSON_LICENSE=MIT

# Secure C runtime required by NSTACKX utility/control sources.
SECUREC_REPOSITORY=https://github.com/openharmony/third_party_bounds_checking_function.git
SECUREC_COMMIT=61baa7a3eb9347efca58397d1d0504faa96d79f0
SECUREC_LICENSE=MulanPSL-2.0

# Candidate crypto backend for Android DFile adaptation. The DFile/OpenHarmony
# crypto calls still require an explicit Android adapter and API compatibility
# review before this dependency can be linked into the application.
MBEDTLS_REPOSITORY=https://github.com/openharmony/third_party_mbedtls.git
MBEDTLS_COMMIT=15a33d7caace0ce655b4cdf20a1f440cf9afa712
MBEDTLS_LICENSE=Apache-2.0-or-GPL-2.0-or-later

# Required framework submodule for the pinned Mbed TLS 3.6.5 source snapshot.
# Exact gitlink revision from the official mbedtls-3.6.5 release tag.
MBEDTLS_FRAMEWORK_REPOSITORY=https://github.com/Mbed-TLS/mbedtls-framework.git
MBEDTLS_FRAMEWORK_COMMIT=457996474728cb8e968ed21953b72f74d2f536b2
