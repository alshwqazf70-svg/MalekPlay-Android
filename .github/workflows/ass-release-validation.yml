name: ASS Media Release Validation

on:
  push:
    branches:
      - feature/zapya-engineering-analysis
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ass-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests, lint and minified release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Run requested verification
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            testDebugUnitTest lintDebug :app:assembleRelease

      - name: Verify R8 preserved Matroska reflection rules
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          configuration="app/build/outputs/mapping/release/configuration.txt"
          test -s "$mapping"
          test -s "$configuration"
          grep -F -- '-keepclassmembers class androidx.media3.extractor.mkv.MatroskaExtractor' "$configuration"
          grep -F 'extractorOutput' "$configuration"
          grep -F 'subtitleSample' "$configuration"
          echo "R8 mapping generated and Matroska reflection keep rules are present." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R8 mapping and merged configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ass-release-r8-verification
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: warn
          retention-days: 14
