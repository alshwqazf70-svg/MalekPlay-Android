name: Ultra Share Android Compile and JVM Validation

on:
  push:
    branches:
      - feature/zapya-engineering-analysis
  workflow_dispatch:

concurrency:
  group: ultrashare-android-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-compile-and-unit-tests:
    name: Android Kotlin compile and JVM regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android app and run JVM tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrashare-android-jvm-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
