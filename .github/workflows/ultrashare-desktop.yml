name: UltraShare Protocol and Android Validation

on:
  push:
    branches:
      - feature/zapya-engineering-analysis
  pull_request:
    branches:
      - feature/zapya-engineering-analysis

permissions:
  contents: read

jobs:
  desktop-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Compile desktop modules
        run: |
          python -m py_compile desktop/ultra_share_v2.py desktop/ultra_share_pc.py desktop/ultra_share_web.py
      - name: Run V1 and V2 desktop tests
        working-directory: desktop
        run: python -m unittest discover -s . -p "test_*.py" -v

  android-compile-and-unit-tests:
    name: Android Kotlin compile and JVM regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Locate SDK manager and accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          echo "SDKMANAGER_PATH=$sdkmanager_path" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses
      - name: Install Android SDK platform and build tools
        run: "$SDKMANAGER_PATH" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android app and run JVM tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrashare-android-jvm-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
