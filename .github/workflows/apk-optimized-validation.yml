name: MalekPlay Optimized arm64 Release Validation

on:
  push:
    branches:
      - backup/pre-apk-size-optimization-2026-11-02
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/apk-optimized-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, inspect and package optimized Note 9 APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build optimized release APK
        run: gradle --no-daemon :app:clean :app:assembleRelease
      - name: Verify APK structure, ABI, package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p audit
          cp "$APK" MalekPlay-Note9-arm64-optimized.apk
          apksigner verify --verbose "$APK" | tee audit/signature-verification.txt
          aapt dump badging "$APK" | tee audit/apk-badging.txt
          grep -q "package: name='com.malekplay'" audit/apk-badging.txt
          unzip -l "$APK" > audit/apk-entries.txt
          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' audit/apk-entries.txt; then
            echo "Unexpected non-arm64 native ABI found" >&2
            exit 1
          fi
          grep -q 'lib/arm64-v8a/' audit/apk-entries.txt
          {
            echo "APK bytes: $(stat -c%s "$APK")"
            echo "APK MiB: $(awk -v n="$(stat -c%s "$APK")" 'BEGIN {printf "%.2f", n/1048576}')"
            echo "Native libraries:"
            grep -E 'lib/[^/]+/.*\.so$' audit/apk-entries.txt || true
            echo "DEX files:"
            grep -E 'classes[0-9]*\.dex$' audit/apk-entries.txt || true
          } | tee audit/optimized-size-report.txt
      - name: Upload installable QA APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-Note9-arm64-optimized-APK
          path: |
            MalekPlay-Note9-arm64-optimized.apk
            audit/
          if-no-files-found: error
          retention-days: 14
