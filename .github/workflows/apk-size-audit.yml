name: MalekPlay APK Size Audit (Baseline)

on:
  push:
    branches:
      - backup/pre-apk-size-optimization-2026-11-02
    paths:
      - ".github/workflows/apk-size-audit.yml"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Build baseline and report APK size contributors
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout protected optimization branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build unchanged debug baseline
        run: gradle --no-daemon :app:assembleDebug

      - name: Report APK size and largest entries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p audit
          APK_BYTES="$(stat -c%s "$APK")"
          unzip -l "$APK" > audit/apk-entries-raw.txt
          sort -nr audit/apk-entries-raw.txt > audit/apk-entries-sorted.txt
          {
            echo "## Baseline APK"
            echo
            echo "- File: $APK"
            echo "- Size (bytes): $APK_BYTES"
            echo "- Size (MiB): $(awk -v n="$APK_BYTES" 'BEGIN {printf "%.2f", n/1048576}')"
            echo
            echo "## Largest APK entries"
            sed -n '1,35p' audit/apk-entries-sorted.txt
            echo
            echo "## Native libraries by ABI"
            grep -E 'lib/[^/]+/.*\.so$' audit/apk-entries-raw.txt || true
            echo
            echo "## DEX files"
            grep -E 'classes[0-9]*\.dex$' audit/apk-entries-raw.txt || true
            echo
            echo "## Resource/assets totals"
            awk 'NF >= 4 && $4 !~ /\/$/ {n++; bytes += $1} END {printf "Entries: %d\nUncompressed bytes: %d\n", n, bytes}' audit/apk-entries-raw.txt
          } | tee audit/apk-size-report.txt

      - name: Capture runtime dependency graph
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > audit/debug-runtime-dependencies.txt
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > audit/release-runtime-dependencies.txt

      - name: Capture dependency insight for major libraries
        shell: bash
        run: |
          {
            for dep in androidx.media3 com.google.mlkit com.hierynomus com.squareup.okhttp3 com.google.dagger androidx.compose.material; do
              echo "===== $dep ====="
              gradle --no-daemon :app:dependencyInsight --configuration debugRuntimeClasspath --dependency "$dep" || true
            done
          } > audit/dependency-insight.txt

      - name: Upload baseline APK and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-baseline-size-audit
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            audit/
          if-no-files-found: error
          retention-days: 14
