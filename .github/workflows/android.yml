name: Build MalekPlayer Android APK

on:
  push:
    branches:
      - backup/before-updated-2.0
      - performance/large-library-optimization
      - feature/ultrashare-bidirectional-2026-11-08
      - feature/zapya-engineering-analysis
  workflow_dispatch:

concurrency:
  group: malekplay-android-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build universal Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble universal Debug APK
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare compressed universal install package
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MalekPlayer-2.0-universal.apk
          cat > dist/README_AR.txt <<'EOF'
          MalekPlayer 2.0 - نسخة Android للتثبيت

          طريقة التثبيت:
          1) فك ضغط ملف MalekPlayer-2.0-Android.zip.
          2) افتح MalekPlayer-2.0-universal.apk من هاتف Android.
          3) إذا طلب الهاتف الإذن، اسمح بالتثبيت من هذا المصدر.
          4) أكمل التثبيت ثم افتح MalekPlayer.

          هذه حزمة APK شاملة لمعالجات Android الشائعة (ARM و x86).
          EOF
          cd dist
          sha256sum MalekPlayer-2.0-universal.apk > SHA256SUMS.txt
          zip -9 MalekPlayer-2.0-Android.zip MalekPlayer-2.0-universal.apk README_AR.txt SHA256SUMS.txt
          unzip -t MalekPlayer-2.0-Android.zip
          echo "## Universal Debug install package" >> "$GITHUB_STEP_SUMMARY"
          ls -lh MalekPlayer-2.0-universal.apk MalekPlayer-2.0-Android.zip >> "$GITHUB_STEP_SUMMARY"
      - name: Upload universal install package
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-universal-install
          path: |
            dist/MalekPlayer-2.0-universal.apk
            dist/MalekPlayer-2.0-Android.zip
            dist/README_AR.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release-apks:
    name: Build one universal Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble a single universal minified Release APK
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            :app:assembleRelease
      - name: Verify and measure optimized Release APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          echo "## Release APK signature verification" >> "$GITHUB_STEP_SUMMARY"
          for apk in "${apks[@]}"; do
            if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "Signed and verified: $apk" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Unsigned Release APK (not ready for direct installation): $apk" >> "$GITHUB_STEP_SUMMARY"
            fi
            stat -c '%n %s bytes' "$apk"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload optimized Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-universal-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  release-aab:
    name: Build Google Play Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble Google Play Android App Bundle
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            :app:bundleRelease
          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          test -s "$aab"
      - name: Measure Google Play App Bundle
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          echo "## Google Play AAB size" >> "$GITHUB_STEP_SUMMARY"
          stat -c '%n %s bytes' "$aab" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-google-play-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Set up Python for Kotlin-Python V2 socket interoperability tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python V2 receiver dependency
        run: python -m pip install -r desktop/requirements.txt
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK packages required by Gradle
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run JVM unit tests including Kotlin-Python V2 TCP interoperability
        env:
          ULTRASHARE_CROSS_LANG: "1"
        run: ./gradlew --build-cache --stacktrace --max-workers=2 :app:testDebugUnitTest
      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  android-test-apks:
    name: Build Android instrumentation APKs once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Build app and instrumentation APKs once for all API levels
        run: |
          ./gradlew --build-cache --parallel --stacktrace --max-workers=2 \
            -PtargetAbi=x86_64 \
            :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload prebuilt instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1

  android-test-apks:
    name: Build Android test APKs once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK packages required by test compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build x86_64 app and instrumentation APKs once
        run: |
          ./gradlew --build-cache --stacktrace --max-workers=2 -PtargetAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload prebuilt app and instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  android-runtime-tests:
    name: Android ${{ matrix.suite }} tests (API ${{ matrix.api-level }})
    needs: android-test-apks
    # Ubuntu 26.04 runner image currently launches API 23 without KVM and emulator exits.
    # Pin the emulator matrix to the stable 24.04 image with hardware acceleration.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { api-level: 23, suite: network }
          - { api-level: 29, suite: network }
          - { api-level: 36, suite: network }
          - { api-level: 23, suite: core }
          - { api-level: 29, suite: core }
          - { api-level: 36, suite: core }
          - { api-level: 23, suite: video }
          - { api-level: 29, suite: video }
          - { api-level: 36, suite: video }
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Restore Android emulator system-image cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ matrix.api-level }}-google_apis/x86_64
          key: android-system-image-${{ runner.os }}-api-${{ matrix.api-level }}-google-apis-x86_64-v1
      - name: Install Android emulator system image
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
      - name: Download prebuilt app and instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: app/build/outputs/apk
      - name: Run selected Android suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 360
          cores: 4
          ram-size: 4096
          heap-size: 1024
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/run_android_runtime_tests.sh ${{ matrix.api-level }} ${{ matrix.suite }}
      - name: Upload Android runtime test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.suite }}-diagnostics-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            ultrashare-diagnostics/
          if-no-files-found: warn
          retention-days: 30

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK packages required by Gradle
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android lint
        run: ./gradlew --build-cache --parallel --stacktrace --max-workers=2 :app:lintDebug
      - name: Print Android lint diagnostics
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  desktop-protocol-tests:
    name: Desktop companion protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop companion dependency
        run: python -m pip install -r desktop/requirements.txt
      - name: Run desktop protocol tests
        working-directory: desktop
        run: python -m unittest -v

