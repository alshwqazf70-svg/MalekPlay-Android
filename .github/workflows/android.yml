name: Build MalekPlay Android APK

# Builds are started manually after a complete batch of saved improvements.
# This prevents every per-file commit from triggering a long Android build.
on:
  push:
    branches: [ "backup/before-updated-2.0" ]
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run the slow Android emulator UI tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: malekplay-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK and optimized release outputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble ABI-specific debug APKs
        run: gradle --stacktrace --max-workers=2 -PenableAbiSplits=true :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Assemble universal debug APK for direct installation
        run: |
          rm -rf app/build/outputs/apk/debug
          gradle --stacktrace --max-workers=2 :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MalekPlay-universal-debug.apk
          cd dist
          zip -9 MalekPlay-universal-debug.zip MalekPlay-universal-debug.apk
          unzip -t MalekPlay-universal-debug.zip

      - name: Upload universal install package
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-universal-install
          path: dist/MalekPlay-universal-debug.zip
          if-no-files-found: error
          retention-days: 14

      - name: Assemble ABI-specific minified release APKs
        run: gradle --stacktrace --max-workers=2 -PenableAbiSplits=true :app:assembleRelease

      - name: Assemble Google Play Android App Bundle
        run: gradle --stacktrace --max-workers=2 :app:bundleRelease

      - name: Upload release size-analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-release-size-analysis
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          echo "## MalekPlay build outputs" >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/outputs/apk/debug ]; then
            echo "### ABI-specific Debug APKs" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -d app/build/outputs/apk/release ]; then
            echo "### ABI-specific minified Release APKs" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -d app/build/outputs/bundle/release ]; then
            echo "### Android App Bundle" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/bundle/release/*.aab >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

  quality-checks:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: gradle --stacktrace --max-workers=2 :app:testDebugUnitTest

      - name: Run Android lint
        if: always()
        run: gradle --stacktrace --max-workers=2 :app:lintDebug

      - name: Print Android lint diagnostics
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  emulator-ui-tests:
    name: Android emulator UI tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android UI smoke tests on emulator
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            mkdir -p artifacts
            emulator -version > artifacts/emulator-setup.txt 2>&1 || true
            adb version >> artifacts/emulator-setup.txt 2>&1 || true
          script: |
            mkdir -p artifacts
            adb devices -l > artifacts/emulator-devices.txt 2>&1 || true
            adb logcat -c || true
            set +e
            gradle --stacktrace --max-workers=2 :app:connectedDebugAndroidTest > artifacts/instrumentation-tests.txt 2>&1
            TEST_EXIT=$?
            cat artifacts/instrumentation-tests.txt
            adb logcat -d -v threadtime > artifacts/emulator-logcat.txt 2>&1 || true
            adb shell dumpsys activity activities > artifacts/emulator-activities.txt 2>&1 || true
            adb shell pm list instrumentation > artifacts/installed-instrumentation.txt 2>&1 || true
            if [ "$TEST_EXIT" -ne 0 ]; then
              adb shell screencap -p /sdcard/malekplay-test-failure.png || true
              adb pull /sdcard/malekplay-test-failure.png artifacts/malekplay-test-failure.png || true
              exit "$TEST_EXIT"
            fi
            adb shell monkey -p com.malekplay -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell screencap -p /sdcard/malekplay-home.png
            adb pull /sdcard/malekplay-home.png artifacts/malekplay-home.png

      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          timeout 20s adb devices -l > artifacts/emulator-devices-final.txt 2>&1 || true
          timeout 30s adb logcat -d -v threadtime > artifacts/emulator-logcat-final.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > artifacts/emulator-activities-final.txt 2>&1 || true
          timeout 20s adb shell pm list instrumentation > artifacts/installed-instrumentation-final.txt 2>&1 || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-emulator-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
