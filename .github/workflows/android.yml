name: Build MalekPlay Android APK

# Build automatically for every update to the protected development branch.
on:
  push:
    branches:
      - backup/before-updated-2.0
      - performance/large-library-optimization
      - feature/ultrashare-bidirectional-2026-11-08
      - feature/zapya-engineering-analysis
  workflow_dispatch:

concurrency:
  group: malekplay-android-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK and optimized release outputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle and cache distributions
        uses: gradle/actions/setup-gradle@v4

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble ABI-specific debug APKs (retry transient dependency downloads)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./gradlew --stacktrace --max-workers=2 -PenableAbiSplits=true :app:assembleDebug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying after transient dependency/network errors..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Assemble universal debug APK for direct installation
        run: |
          rm -rf app/build/outputs/apk/debug
          ./gradlew --stacktrace --max-workers=2 :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MalekPlay-2.0-universal.apk
          cat > dist/README_AR.txt <<'EOF'
          MalekPlay 2.0 - نسخة Android للتثبيت
          
          طريقة التثبيت:
          1) فك ضغط ملف MalekPlay-2.0-Android.zip.
          2) افتح MalekPlay-2.0-universal.apk من هاتف Android.
          3) إذا طلب الهاتف الإذن، اسمح بالتثبيت من هذا المصدر.
          4) أكمل التثبيت ثم افتح MalekPlay.
          
          هذه حزمة APK شاملة لمعالجات Android الشائعة (ARM و x86).
          EOF
          cd dist
          sha256sum MalekPlay-2.0-universal.apk > SHA256SUMS.txt
          zip -9 MalekPlay-2.0-Android.zip MalekPlay-2.0-universal.apk README_AR.txt SHA256SUMS.txt
          unzip -t MalekPlay-2.0-Android.zip
          echo "### Universal APK and compressed package sizes" >> "$GITHUB_STEP_SUMMARY"
          ls -lh MalekPlay-2.0-universal.apk MalekPlay-2.0-Android.zip >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal install package
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-universal-install
          path: dist/MalekPlay-2.0-Android.zip
          if-no-files-found: error
          retention-days: 14

      - name: Assemble ABI-specific minified release APKs
        run: ./gradlew --stacktrace --max-workers=2 -PenableAbiSplits=true :app:assembleRelease

      - name: Assemble Google Play Android App Bundle
        run: ./gradlew --stacktrace --max-workers=2 :app:bundleRelease

      - name: Measure optimized release APK and AAB sizes
        shell: bash
        run: |
          {
            echo "## Optimized Release size measurements"
            echo 'All values below are exact artifact file sizes in bytes; no ABI or codec is excluded.'
            echo '```text'
            find app/build/outputs/apk/release app/build/outputs/bundle/release -type f \
              \( -name '*.apk' -o -name '*.aab' \) -printf '%p %s bytes\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release size-analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-release-size-analysis
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          echo "## MalekPlay build outputs" >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/outputs/apk/debug ]; then
            echo "### ABI-specific Debug APKs" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -d app/build/outputs/apk/release ]; then
            echo "### ABI-specific minified Release APKs" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -d app/build/outputs/bundle/release ]; then
            echo "### Android App Bundle" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/bundle/release/*.aab >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

  quality-checks:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle and cache distributions
        uses: gradle/actions/setup-gradle@v4

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew --stacktrace --max-workers=2 :app:testDebugUnitTest

      - name: Run Android lint
        if: success()
        run: ./gradlew --stacktrace --max-workers=2 :app:lintDebug

      - name: Print Android lint diagnostics
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  desktop-protocol-tests:
    name: Desktop companion protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop companion dependency
        run: python -m pip install -r desktop/requirements.txt

      - name: Run desktop protocol tests
        working-directory: desktop
        run: python -m unittest -v
