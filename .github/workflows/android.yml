name: Build MalekPlayer Android APK

on:
  push:
    branches:
      - backup/before-updated-2.0
      - performance/large-library-optimization
      - feature/ultrashare-bidirectional-2026-11-08
      - feature/zapya-engineering-analysis
  workflow_dispatch:

concurrency:
  group: malekplay-android-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build universal Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK and native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned NSTACKX source trees
        run: bash scripts/prepare_nstackx_sources.sh
      - name: Assemble universal Debug APK
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            -PenableNstackxNativeBuild=true :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare compressed universal install package
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MalekPlayer-2.0-universal.apk
          cat > dist/README_AR.txt <<'EOF'
          MalekPlayer 2.0 - نسخة Android للتثبيت

          طريقة التثبيت:
          1) فك ضغط ملف MalekPlayer-2.0-Android.zip.
          2) افتح MalekPlayer-2.0-universal.apk من هاتف Android.
          3) إذا طلب الهاتف الإذن، اسمح بالتثبيت من هذا المصدر.
          4) أكمل التثبيت ثم افتح MalekPlayer.

          هذه حزمة APK شاملة لمعالجات Android الشائعة (ARM و x86).
          EOF
          cd dist
          sha256sum MalekPlayer-2.0-universal.apk > SHA256SUMS.txt
          zip -9 MalekPlayer-2.0-Android.zip MalekPlayer-2.0-universal.apk README_AR.txt SHA256SUMS.txt
          unzip -t MalekPlayer-2.0-Android.zip
          echo "## Universal Debug install package" >> "$GITHUB_STEP_SUMMARY"
          ls -lh MalekPlayer-2.0-universal.apk MalekPlayer-2.0-Android.zip >> "$GITHUB_STEP_SUMMARY"
      - name: Upload universal install package
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-universal-install
          path: |
            dist/MalekPlayer-2.0-universal.apk
            dist/MalekPlayer-2.0-Android.zip
            dist/README_AR.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release-apks:
    name: Build optimized ABI-specific Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK and native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned NSTACKX source trees
        run: bash scripts/prepare_nstackx_sources.sh
      - name: Assemble ABI-specific minified Release APKs
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            -PenableNstackxNativeBuild=true \
            -PenableAbiSplits=true :app:assembleRelease
      - name: Verify and measure optimized Release APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          echo "## Release APK signature verification" >> "$GITHUB_STEP_SUMMARY"
          for apk in "${apks[@]}"; do
            if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "Signed and verified: $apk" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Unsigned Release APK (not ready for direct installation): $apk" >> "$GITHUB_STEP_SUMMARY"
            fi
            stat -c '%n %s bytes' "$apk"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload optimized Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  release-aab:
    name: Build Google Play Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK and native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned NSTACKX source trees
        run: bash scripts/prepare_nstackx_sources.sh
      - name: Assemble Google Play Android App Bundle
        run: |
          ./gradlew --stacktrace --max-workers=2 \
            -PmalekplayVersionCode="$GITHUB_RUN_NUMBER" \
            -PmalekplayVersionName="2.0.$GITHUB_RUN_NUMBER" \
            -PenableNstackxNativeBuild=true :app:bundleRelease
          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          test -s "$aab"
      - name: Measure Google Play App Bundle
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          echo "## Google Play AAB size" >> "$GITHUB_STEP_SUMMARY"
          stat -c '%n %s bytes' "$aab" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlayer-google-play-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  quality-checks:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: ./gradlew --stacktrace --max-workers=2 :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --stacktrace --max-workers=2 :app:lintDebug
      - name: Print Android lint diagnostics
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  desktop-protocol-tests:
    name: Desktop companion protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop companion dependency
        run: python -m pip install -r desktop/requirements.txt
      - name: Run desktop protocol tests
        working-directory: desktop
        run: python -m unittest -v

  android-instrumentation:
    name: Android ${{ matrix.api-level }} emulator smoke and Room migration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned NSTACKX source trees
        run: bash scripts/prepare_nstackx_sources.sh
      - name: Run instrumentation tests on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew --stacktrace --max-workers=2 -PenableNstackxNativeBuild=true :app:connectedDebugAndroidTest
