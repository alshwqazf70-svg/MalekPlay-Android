name: Build MalekPlay Android APK

on:
  push:
    branches: [ "main", "backup/before-updated-2.0" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: malekplay-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Print Android lint diagnostics
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run Android UI smoke tests on emulator
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            mkdir -p artifacts
            emulator -version > artifacts/emulator-setup.txt 2>&1 || true
            adb version >> artifacts/emulator-setup.txt 2>&1 || true
          script: |
            mkdir -p artifacts
            set +e
            adb devices -l > artifacts/emulator-devices.txt 2>&1
            adb logcat -c || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            TEST_EXIT=$?
            adb logcat -d -v threadtime > artifacts/emulator-logcat.txt
            adb shell dumpsys activity activities > artifacts/emulator-activities.txt 2>&1
            adb shell pm list instrumentation > artifacts/installed-instrumentation.txt 2>&1
            if [ "$TEST_EXIT" -ne 0 ]; then
              adb shell screencap -p /sdcard/malekplay-test-failure.png || true
              adb pull /sdcard/malekplay-test-failure.png artifacts/malekplay-test-failure.png || true
              exit "$TEST_EXIT"
            fi
            adb shell monkey -p com.malekplay -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell screencap -p /sdcard/malekplay-home.png
            adb pull /sdcard/malekplay-home.png artifacts/malekplay-home.png

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-emulator-diagnostics
          path: |
            artifacts/emulator-logcat.txt
            artifacts/emulator-activities.txt
            artifacts/installed-instrumentation.txt
            artifacts/emulator-devices.txt
            artifacts/emulator-setup.txt
            artifacts/malekplay-test-failure.png
          if-no-files-found: warn

      - name: Upload emulator home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MalekPlay-emulator-home
          path: artifacts/malekplay-home.png
          if-no-files-found: warn
